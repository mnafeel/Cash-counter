name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the cash counter app on the subdomain:
# https://cc.shalimarfashions.com/
# GitHub → Settings → Pages → Deploy from a branch → main → / (root)
#
# DNS: CNAME record  cc  →  mnafeel.github.io
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Publish app to main branch (subdomain root)
        run: |
          set -euo pipefail
          ls -la dist

          printf 'cc.shalimarfashions.com\n' > CNAME

          # Remove previous Coming Soon / path-based publish leftovers
          rm -rf assets styles.css scene.js main.js SFCC-Admin docs

          # Publish built app at repository root for subdomain hosting
          # Keep source files (src/, package.json, etc.) — only replace site outputs.
          find dist -mindepth 1 -maxdepth 1 -exec cp -R {} . \;

          # Legacy path redirect folder so old /SFCC-Admin bookmarks still work on the subdomain
          mkdir -p SFCC-Admin
          cat > SFCC-Admin/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=/" />
              <link rel="canonical" href="/" />
              <title>Redirecting…</title>
              <script>location.replace("/")</script>
            </head>
            <body></body>
          </html>
          EOF

          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f -- CNAME index.html .nojekyll favicon.png logo.png apple-touch-icon.png icon.png assets SFCC-Admin
          # Drop obsolete Coming Soon files if they reappear
          git rm -f --ignore-unmatch styles.css scene.js main.js pages-root/styles.css pages-root/scene.js pages-root/main.js 2>/dev/null || true
          git add -u

          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "deploy: publish cash counter to cc subdomain [skip ci]"

          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push failed, retry ${attempt}..."
            sleep 8
          done
          exit 1
