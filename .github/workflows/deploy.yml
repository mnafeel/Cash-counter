name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Main domain: Coming Soon at https://shalimarfashions.com/
# Cash Counter:     https://shalimarfashions.com/SFCC-Admin/
# GitHub → Settings → Pages → Deploy from a branch → main → / (root)
#
# DNS (apex): A records @ → 185.199.108.153 / .109.153 / .110.153 / .111.153
# DNS (www):  CNAME www → mnafeel.github.io
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cash Counter for /SFCC-Admin/
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Publish Coming Soon root + SFCC-Admin
        run: |
          set -euo pipefail
          test -f pages-root/index.html
          test -d dist
          ls -la dist

          printf 'shalimarfashions.com\n' > CNAME

          # Clear previous publish outputs (keep source tree)
          rm -rf SFCC-Admin sfcc-admin docs
          rm -rf assets styles.css scene.js main.js
          # Remove any previous root Vite publish leftovers (not source)
          rm -f favicon.svg icons.svg

          # 1) Public Coming Soon homepage at domain root
          cp -f pages-root/index.html index.html
          cp -f pages-root/styles.css styles.css
          cp -f pages-root/scene.js scene.js
          cp -f pages-root/main.js main.js
          mkdir -p assets
          cp -f pages-root/assets/* assets/

          if grep -Eq 'SFCC-Admin|http-equiv="refresh"' index.html; then
            echo "Root Coming Soon page must not redirect to SFCC-Admin" >&2
            exit 1
          fi

          # 2) Cash Counter under /SFCC-Admin/
          mkdir -p SFCC-Admin
          cp -R dist/. SFCC-Admin/
          touch SFCC-Admin/.nojekyll

          test -f SFCC-Admin/index.html
          test -d SFCC-Admin/assets

          # Optional lowercase alias → canonical path
          mkdir -p sfcc-admin
          cat > sfcc-admin/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=/SFCC-Admin/" />
              <link rel="canonical" href="/SFCC-Admin/" />
              <title>Redirecting…</title>
              <script>location.replace("/SFCC-Admin/")</script>
            </head>
            <body>
              <p><a href="/SFCC-Admin/">Continue to SFCC Admin</a></p>
            </body>
          </html>
          EOF

          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f -- \
            CNAME \
            index.html \
            styles.css \
            scene.js \
            main.js \
            assets \
            SFCC-Admin \
            sfcc-admin \
            .nojekyll \
            favicon.png \
            logo.png \
            apple-touch-icon.png \
            icon.png \
            pages-root

          git add -u

          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "deploy: Coming Soon root + SFCC-Admin app [skip ci]"

          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push failed, retry ${attempt}..."
            sleep 8
          done
          exit 1
