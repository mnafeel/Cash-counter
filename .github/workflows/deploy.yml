name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the app under /SFCC-Admin/ for custom domain hosting
# (e.g. https://shalimarfashions.com/SFCC-Admin/).
# GitHub → Settings → Pages → Deploy from a branch → main → / (root)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Publish SFCC-Admin build to main branch
        run: |
          set -euo pipefail
          ls -la dist

          printf 'shalimarfashions.com\n' > CNAME

          # Public Coming Soon homepage — never redirect or link to SFCC-Admin.
          cp -f pages-root/index.html index.html
          cp -f pages-root/styles.css styles.css
          cp -f pages-root/scene.js scene.js
          cp -f pages-root/main.js main.js
          rm -rf assets
          mkdir -p assets
          cp -R pages-root/assets/. assets/
          # Safety: strip any accidental admin redirect if the source is edited wrongly.
          if grep -Eq 'SFCC-Admin|http-equiv="refresh"' index.html; then
            echo "Refusing to publish root index.html that redirects to SFCC-Admin" >&2
            exit 1
          fi

          # Replace published app folders (admin stays under /SFCC-Admin/)
          rm -rf SFCC-Admin docs
          mkdir -p SFCC-Admin docs
          cp -R dist/. SFCC-Admin/
          cp -R dist/. docs/
          # Keep app favicon/logo filenames available for the admin build paths;
          # Coming Soon uses assets/logo.png as its favicon.
          cp -f SFCC-Admin/favicon.png favicon.png
          cp -f SFCC-Admin/logo.png logo.png
          touch .nojekyll SFCC-Admin/.nojekyll docs/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f -- index.html styles.css scene.js main.js assets CNAME SFCC-Admin docs favicon.png logo.png .nojekyll
          git add -u

          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "deploy: publish SFCC-Admin build [skip ci]"

          # Working tree must stay clean for rebase; autostash covers race updates
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push failed, retry ${attempt}..."
            sleep 8
          done
          exit 1
