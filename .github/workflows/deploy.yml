name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Main domain: Coming Soon at https://shalimarfashions.com/
# Cash Counter: https://shalimarfashions.com/cash-counter/
# Aliases: /SFCC-Admin/index.html and /sfcc-admin/index.html → /cash-counter/
#
# Note: /SFCC-Admin/ (folder URL) was stuck on a CDN 404; use /cash-counter/ as canonical.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cash Counter for /cash-counter/
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Publish Coming Soon root + cash-counter app
        run: |
          set -euo pipefail
          test -f pages-root/index.html
          test -d dist
          ls -la dist

          printf 'shalimarfashions.com\n' > CNAME

          # Clear previous publish outputs (keep source tree)
          rm -rf cash-counter SFCC-Admin sfcc-admin docs
          rm -rf assets styles.css scene.js main.js
          rm -f favicon.svg icons.svg

          # 1) Public Coming Soon homepage at domain root
          cp -f pages-root/index.html index.html
          cp -f pages-root/styles.css styles.css
          cp -f pages-root/scene.js scene.js
          cp -f pages-root/main.js main.js
          mkdir -p assets
          cp -f pages-root/assets/* assets/

          if grep -Eqi 'cash-counter|SFCC-Admin|http-equiv="refresh"' index.html; then
            echo "Root Coming Soon page must not redirect to the admin app" >&2
            exit 1
          fi

          # 2) Cash Counter under /cash-counter/ (fresh path; avoids stale CDN 404)
          mkdir -p cash-counter
          cp -R dist/. cash-counter/
          touch cash-counter/.nojekyll
          test -f cash-counter/index.html
          test -d cash-counter/assets

          # 3) Legacy aliases → /cash-counter/ (SFCC-Admin folder URLs were CDN-404 cached)
          mkdir -p SFCC-Admin sfcc-admin
          cp -f pages-root/redirect-cash-counter.html SFCC-Admin/index.html
          cp -f pages-root/redirect-cash-counter.html sfcc-admin/index.html
          cp -f pages-root/redirect-cash-counter.html SFCC-Admin.html
          cp -f pages-root/redirect-cash-counter.html sfcc-admin.html

          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f -- \
            CNAME \
            index.html \
            styles.css \
            scene.js \
            main.js \
            assets \
            cash-counter \
            SFCC-Admin \
            sfcc-admin \
            SFCC-Admin.html \
            sfcc-admin.html \
            .nojekyll \
            favicon.png \
            logo.png \
            apple-touch-icon.png \
            icon.png \
            pages-root

          git add -u

          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "deploy: Coming Soon root + cash-counter app [skip ci]"

          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push failed, retry ${attempt}..."
            sleep 8
          done
          exit 1
