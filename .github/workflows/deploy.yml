name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the app under /SFCC-Admin/ for custom domain hosting
# (e.g. https://shalimarfashions.com/SFCC-Admin/).
# GitHub → Settings → Pages → Deploy from a branch → main → / (root)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Publish SFCC-Admin build to main branch
        run: |
          set -euo pipefail
          ls -la dist

          printf 'shalimarfashions.com\n' > CNAME

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=/SFCC-Admin/" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Shalimar Fashions</title>
              <link rel="canonical" href="/SFCC-Admin/" />
            </head>
            <body>
              <p><a href="/SFCC-Admin/">Open SFCC Admin</a></p>
            </body>
          </html>
          EOF

          # Replace published folders (drop old root /assets from previous Pages layout)
          rm -rf SFCC-Admin docs
          mkdir -p SFCC-Admin docs
          cp -R dist/. SFCC-Admin/
          cp -R dist/. docs/
          cp -f SFCC-Admin/favicon.png favicon.png
          cp -f SFCC-Admin/logo.png logo.png
          touch .nojekyll SFCC-Admin/.nojekyll docs/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage publish outputs + delete obsolete root assets if present
          if [ -d assets ]; then
            git rm -rf --ignore-unmatch assets
            rm -rf assets
          fi
          git add -f -- index.html CNAME SFCC-Admin docs favicon.png logo.png .nojekyll
          # Catch deletions of obsolete root /assets from older Pages layout
          git add -u -- assets || true
          git add -u

          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "deploy: publish SFCC-Admin build [skip ci]"

          # Working tree must stay clean for rebase; autostash covers race updates
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push failed, retry ${attempt}..."
            sleep 8
          done
          exit 1
