name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cash Counter only: https://cash-counter.shalimarfashions.com/
# Main site (shalimarfashions.com) is separate — leave blank / other repo.

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cash Counter
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Publish app to Pages root
        run: |
          set -euo pipefail
          test -d dist
          ls -la dist

          printf 'cash-counter.shalimarfashions.com\n' > CNAME

          # Remove old path-based / Coming Soon publish leftovers
          rm -rf cash-counter SFCC-Admin sfcc-admin docs
          rm -f SFCC-Admin.html sfcc-admin.html
          rm -rf assets styles.css scene.js main.js
          rm -f favicon.svg icons.svg

          # App at subdomain root
          cp -R dist/. .
          touch .nojekyll
          test -f index.html

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f -- \
            CNAME \
            index.html \
            assets \
            .nojekyll \
            favicon.png \
            logo.png \
            apple-touch-icon.png \
            icon.png

          git add -u

          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "deploy: cash-counter.shalimarfashions.com [skip ci]"

          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push failed, retry ${attempt}..."
            sleep 8
          done
          exit 1
